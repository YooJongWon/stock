name: US stock screener

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Unused for the one-off monthly watchlist"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monthly-only:
    if: github.ref == 'refs/heads/codex/monthly-momentum-bootstrap-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Restore existing market price data
        uses: actions/cache/restore@v4
        with:
          path: work/momentum/daily-prices
          key: momentum-market-${{ runner.os }}-45275357423
          restore-keys: momentum-market-${{ runner.os }}-
          fail-on-cache-miss: true
      - name: Calculate monthly rankings from cached prices
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m scripts.monthly_bootstrap_once
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-momentum-initial
          path: monthly-momentum-initial.json
          if-no-files-found: error
          retention-days: 3
